name: ci
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "AGENTS.md", "LICENSE", "LICENSE.md", "LICENSES/**"]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      valkey:
        image: valkey/valkey:8.1
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      VALKEY_URL: redis://127.0.0.1:6379/
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: rustc --version
      - run: cargo generate-lockfile
      - run: cargo metadata --locked --all-features --format-version 1 > dependency-metadata.json
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked -- --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-lock
          path: |
            Cargo.lock
            dependency-metadata.json
