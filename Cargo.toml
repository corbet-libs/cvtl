[package]
name = "cvtl"
version = "0.1.0"
edition = "2024"
description = "Volatile: thin composition of Memory and Valkey storage"
license-file = "LICENSE.md"
repository = "https://github.com/corbet-libs/cvtl"
publish = false

[dependencies]
cmmr = { git = "https://github.com/corbet-foss/cmmr", rev = "8ae6a60d7d88c85e121a6cee292ea149afbd59b0" }
cvlk = { git = "https://github.com/corbet-foss/cvlk", rev = "61bde6ee122cd4222e6a82547352e03ebc40469f" }

[dev-dependencies]
cmmr = { git = "https://github.com/corbet-foss/cmmr", rev = "8ae6a60d7d88c85e121a6cee292ea149afbd59b0", features = ["conformance"] }
redis = { version = "1", default-features = false, features = ["tokio-comp"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
